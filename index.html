<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>हरे कृष्ण मंत्र काउंटर</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e1e2f, #252542);
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .counter-card {
            background: #2d2d44;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        h2 { color: #ff9f43; margin-bottom: 5px; }
        .mantra-text { font-size: 16px; color: #ccc; font-style: italic; margin-bottom: 20px; }
        .display-section { margin: 20px 0; }
        .round-box { font-size: 18px; color: #1dd1a1; margin-bottom: 10px; }
        .count-box { font-size: 72px; font-weight: bold; color: #ff6b6b; font-family: monospace; }
        .tap-btn {
            background: #ff9f43;
            color: white;
            border: none;
            padding: 20px 40px;
            font-size: 22px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 5px 15px rgba(255, 159, 67, 0.4);
            transition: transform 0.1s;
        }
        .tap-btn:active { transform: scale(0.98); }
        .reset-btn {
            background: transparent;
            color: #aaa;
            border: 1px solid #555;
            padding: 8px 20px;
            margin-top: 20px;
            border-radius: 5px;
            cursor: pointer;
        }
        .reset-btn:hover { color: #fff; border-color: #aaa; }
    </style>
</head>
<body>

<div class="counter-card">
    <h2>हरे कृष्ण महामंत्र</h2>
    <div class="mantra-text">हरे कृष्ण हरे कृष्ण कृष्ण कृष्ण हरे हरे<br>हरे राम हरे राम राम राम हरे हरे</div>
    
    <div class="display-section">
        <div class="round-box">माला (Rounds): <span id="rounds">0</span></div>
        <div class="count-box" id="counter">0</div>
        <div style="color: #888; font-size: 14px;">/ 108</div>
    </div>

    <button class="tap-btn" id="tapBtn">जप करें (या Spacebar दबाएं)</button>
    <br>
    <button class="reset-btn" id="resetBtn">रीसेट करें</button>
</div>

<script>
    let count = 0;
    let rounds = 0;
    const counterDisplay = document.getElementById('counter');
    const roundsDisplay = document.getElementById('rounds');
    const tapBtn = document.getElementById('tapBtn');
    const resetBtn = document.getElementById('resetBtn');

    // ऑडियो फीडबैक (बीप साउंड) के लिए
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playBeep() {
        const osc = audioCtx.createOscillator();
        osc.connect(audioCtx.destination);
        osc.frequency.setValueAtTime(600, audioCtx.currentTime);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.1);
    }

    function doCount() {
        count++;
        if (count > 108) {
            count = 1; // सुमेरु लांघना नहीं है, इसलिए 1 से वापस शुरू
            rounds++;
            playBeep(); // 1 माला पूरी होने पर बीप
        }
        counterDisplay.innerText = count;
        roundsDisplay.innerText = rounds;
    }

    // बटन क्लिक इवेंट
    tapBtn.addEventListener('click', doCount);

    // कीबोर्ड (Spacebar या Enter) इवेंट
    document.addEventListener('keydown', (e) => {
        if (e.code === 'Space' || e.code === 'Enter') {
            e.preventDefault(); // पेज स्क्रॉल होने से रोकने के लिए
            doCount();
        }
    });

    // रीसेट इवेंट
    resetBtn.addEventListener('click', () => {
        if(confirm("क्या आप काउंटर को शून्य करना चाहते हैं?")) {
            count = 0;
            rounds = 0;
            counterDisplay.innerText = count;
            roundsDisplay.innerText = rounds;
        }
    });
</script>

</body>
</html>
